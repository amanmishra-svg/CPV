          <label style="font-size:12px;color:var(--ink-3);font-weight:500">Cluster</label>
          <select id="csh-cluster" style="min-width:190px">
            <option value="ALL"${csh2.cluster === "ALL" ? " selected" : ""}>All clusters (${clusters.length})</option>
            ${clusters.map(c => `<option value="${escHtml(c)}"${c === csh2.cluster ? " selected" : ""}>${escHtml(c)}</option>`).join("")}
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="font-size:12px;color:var(--ink-3);font-weight:500">EMP Code / name</label>
          <input id="csh-emp" placeholder="filter by code or name…" value="${escHtml(csh2.q)}" style="min-width:200px">
        </div>
        <div class="csh-views">${vbtn("amount", "₹ Amounts")}${vbtn("pervisit", "₹ Per visit")}</div>
        <div id="csh-summary" style="margin-left:auto;font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono',monospace"></div>
      </div>

      <div id="csh-kpi"></div>
      <div id="csh-dq"></div>
      <div id="csh-tbl"></div>
    </div>`;
  document.getElementById("csh-cluster").addEventListener("change", e => { csh2.cluster = e.target.value; redrawClusterSH2(); });
  document.getElementById("csh-emp").addEventListener("input", e => { csh2.q = e.target.value; redrawClusterSH2(); });
  document.querySelectorAll(".csh-view").forEach(b => b.addEventListener("click", () => {
    csh2.view = b.dataset.v;
    document.querySelectorAll(".csh-view").forEach(x => x.classList.toggle("active", x.dataset.v === csh2.view));
    redrawClusterSH2();
  }));
  redrawClusterSH2();
}

function redrawClusterSH2() {
  const M = (RAW && RAW.shCostsMeta) || {};
  const isAll = csh2.cluster === "ALL";
  const q = (csh2.q || "").trim().toLowerCase();
  const ix = bdIndex();
  let rows = (DATA.shCosts || []).filter(r => isAll || r.cluster === csh2.cluster);
  if (q) rows = rows.filter(r => String(r.empCode || "").toLowerCase().includes(q) || String(r.name || "").toLowerCase().includes(q));
  rows = rows.map(r => {
    const v = +r.visits || 0, per = x => (v > 0 ? (+x || 0) / v : null);
    const b = ix[String(r.cluster || "").trim().toLowerCase()];
    const bv = b && +b.visits > 0 ? +b.visits : 0;
    const bike = bv ? (+b.bikePM || 0) / bv : null, vend = bv ? (+b.vendor || 0) / bv : null, sch = bv ? (+b.schedulerPM || 0) / bv : null;
    const ovh = bv ? bike + vend + sch : null, cpv = per(r.totalCost);
    return Object.assign({}, r, {
      sysDays: systemDaysFromDoj(r.doj), salCpv: per(r.salary), incCpv: per(r.incentive), kitCpv: per(r.toolkit),
      rbCpv: per(r.reimbursement), nhcCpv: per(r.newHireCost), cpvC: cpv, bikeV: bike, vendV: vend, schedV: sch, ovh,
      allIn: cpv === null ? null : cpv + (ovh || 0),
    });
  });

  const sum = (k, f) => rows.reduce((s, r) => s + (!f || f(r) ? (+r[k] || 0) : 0), 0);
  const V = sum("visits"), C = sum("totalCost");
  const per = x => (V > 0 ? x / V : null);
  const inView = new Set(rows.map(r => String(r.cluster).trim().toLowerCase()));
  const bdView = (DATA.cpvBreakdown || []).filter(b => inView.has(String(b.cluster).trim().toLowerCase()));
  const ovh = bdAgg(bdView).ovh;
  const vAct = sum("visits", r => r.group === "active"), vIna = sum("visits", r => r.group === "inactive"), vNo = sum("visits", r => r.group === "no_master");
  const zeroSal = rows.filter(r => r.group !== "no_master" && !(+r.salary > 0));

  document.getElementById("csh-summary").textContent = `${rows.length} people · ${inr(V)} visits · ₹${inrShort(C)} cost`;

  const tile = (lbl, val, sub, w, color) => `<div class="cost-tile"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="pct">${sub}</div>${w !== undefined ? `<div class="bar-track"><i style="width:${Math.min(100, w).toFixed(1)}%;background:${color || "var(--ss-navy)"}"></i></div>` : ""}</div>`;
  const amt = (lbl, k, color, sub) => { const v = sum(k); return tile(lbl, "₹" + inrShort(v), (sub ? sub + " · " : "") + pct(v, C) + " of cost", C ? v / C * 100 : 0, color); };
  const pv = (lbl, k, color) => { const v = per(sum(k)); return tile(lbl, v === null ? "—" : "₹" + v.toFixed(1), "per visit", C && v !== null ? v / per(C) * 100 : 0, color); };
  document.getElementById("csh-kpi").innerHTML = `
    <div style="background:var(--ss-sky);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600">Visit reconciliation</div>
      <div><span style="font-size:20px;font-weight:700;color:var(--good)">${inr(vAct)}</span> <span style="font-size:11px;color:var(--ink-3)">active</span></div>
      <span style="color:var(--ink-4)">+</span>
      <div><span style="font-size:20px;font-weight:700;color:var(--ink-2)">${inr(vIna)}</span> <span style="font-size:11px;color:var(--ink-3)">inactive</span></div>
      <span style="color:var(--ink-4)">+</span>
      <div><span style="font-size:20px;font-weight:700;color:#B45309">${inr(vNo)}</span> <span style="font-size:11px;color:var(--ink-3)">not in mastersheet</span></div>
      <span style="color:var(--ink-4)">=</span>
      <div><span style="font-size:22px;font-weight:800;color:var(--ss-navy)">${inr(V)}</span> <span style="font-size:11px;color:var(--ink-3)">visits</span></div>
      <div style="margin-left:auto;font-size:11.5px;color:${zeroSal.length ? "var(--danger)" : "var(--good)"};font-weight:600">${zeroSal.length} SH${zeroSal.length === 1 ? "" : "s"} with ₹0 salary</div>
    </div>
    <div class="grid-6" style="margin-bottom:14px">
      ${tile("Total cost", "₹" + inrShort(C), rows.length + " people", 100, "var(--ss-navy)")}
      ${amt("Salary", "salary", COLOR.costSalary, escHtml(M.salaryTab || ""))}
      ${amt("Incentive", "incentive", COLOR.costIncentive)}
      ${amt("Toolkit", "toolkit", COLOR.costToolkit)}
      ${amt("Reimbursement", "reimbursement", COLOR.costReimb)}
      ${amt("New hire cost", "newHireCost", "var(--ss-amber)", "inside salary")}
    </div>
    <div class="bd-tiles" style="margin-top:0">
      ${tile("CPV · SH-level", per(C) === null ? "—" : "₹" + inr(per(C)), "total cost ÷ visits", 100, "var(--ss-navy)")}
      ${pv("Salary CPV", "salary", COLOR.costSalary)}
      ${pv("Incentive CPV", "incentive", COLOR.costIncentive)}
      ${pv("Toolkit CPV", "toolkit", COLOR.costToolkit)}
      ${pv("Reimb. CPV", "reimbursement", COLOR.costReimb)}
      ${pv("New hire CPV", "newHireCost", "var(--ss-amber)")}
      ${tile("Overheads / visit", ovh === null ? "—" : "₹" + ovh.toFixed(1), "bike + vendor + schedulers · cluster level")}
      ${tile("All-in CPV", per(C) === null ? "—" : "₹" + inr(per(C) + (ovh || 0)), "SH-level CPV + overheads")}
    </div>`;

  // ── data checks ──
  const inScope = c => (isAll || String(c || "").trim().toLowerCase() === csh2.cluster.trim().toLowerCase()) &&
                      (activeSoh === "all" || sohForCluster(c) === activeSoh);
  const inc = ((M.incentive && M.incentive.unmatched) || []).filter(e => inScope(e.cluster === "Bangalore" ? "Bengaluru" : e.cluster));
  const rbz = ((M.reimbursement && M.reimbursement.zeroed) || []).filter(e => inScope(e.cluster));
  const incSum = inc.reduce((s, e) => s + (+e.amount || 0), 0), rbzSum = rbz.reduce((s, e) => s + (+e.amount || 0), 0);
  const mini = (title, head, items) => `<div class="card" style="padding:14px 16px">
      <h3 style="font-size:12.5px">${title}</h3>
      ${items.length ? `<table style="font-size:11.5px;margin-top:8px"><thead><tr>${head.map((h, i) => `<th style="cursor:default;${i === head.length - 1 ? "" : "text-align:left"}">${h}</th>`).join("")}</tr></thead><tbody>${items.join("")}</tbody></table>`
                     : `<div style="font-size:11.5px;color:var(--good);margin-top:6px">Nothing to fix here ✓</div>`}
    </div>`;
  document.getElementById("csh-dq").innerHTML = `
    <div class="csh-dq">
      <button class="csh-dq-btn" id="csh-dq-btn" aria-expanded="false" title="Show the incentive / reimbursement / zero-salary data checks"><span class="plus">+</span> Data checks</button>
      <div class="csh-dq-panel" id="csh-dq-panel">
        <div style="font-size:12px;color:var(--ink-2);margin-bottom:10px">Incentive not matched <b>₹${inr(incSum)}</b> (${inc.length}) · reimbursement set to ₹0 <b>₹${inr(rbzSum)}</b> (${rbz.length}) · <b>${zeroSal.length}</b> SHs with ₹0 salary${isAll && activeSoh === "all" && M.reimbursement ? ` · reimbursement for non-SH / B2B codes <b>₹${inrShort(M.reimbursement.notSH || 0)}</b>` : ""}</div>
      <div class="grid-3" style="margin-top:12px">
        ${mini("Incentive not matched to an SH — fix the name in Incentive Data", ["Scheme", "Name", "Cluster", "₹"],
          inc.sort((a, b) => b.amount - a.amount).map(e => `<tr><td style="text-align:left;font-weight:500">${escHtml(e.scheme)}</td><td style="text-align:left">${escHtml(e.name)}</td><td style="text-align:left">${escHtml(e.cluster)}</td><td>${inr(e.amount)}</td></tr>`))}
        ${mini("Reimbursement set to ₹0 (salary ₹0)", ["EMP", "Name", "Cluster", "Claimed ₹"],
          rbz.sort((a, b) => b.amount - a.amount).map(e => `<tr><td style="text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px">${escHtml(e.code)}</td><td style="text-align:left">${escHtml(e.name)}</td><td style="text-align:left">${escHtml(e.cluster)}</td><td>${inr(e.amount)}</td></tr>`))}
        ${mini(`SHs with ₹0 salary — not in ${escHtml(M.salaryTab || "the salary sheet")}`, ["EMP", "Name", "Cluster", "Visits"],
          zeroSal.sort((a, b) => (b.visits || 0) - (a.visits || 0)).map(r => `<tr><td style="text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px">${escHtml(r.empCode)}</td><td style="text-align:left">${escHtml(r.name)}</td><td style="text-align:left">${escHtml(r.cluster)}</td><td>${inr(r.visits || 0)}</td></tr>`))}
      </div>
      ${isAll && activeSoh === "all" && M.reimbursement && M.reimbursement.notSHList && M.reimbursement.notSHList.length ? (() => {
        const list = M.reimbursement.notSHList;
        const by = M.reimbursement.notSHByBucket || {};
        const buckets = Object.keys(by).filter(k => by[k] > 0);
        const bucketColor = b => b === "B2B" ? "var(--b2b)" : b.indexOf("B2C") === 0 ? "var(--good)" : b.indexOf("Not") === 0 ? "var(--danger)" : "var(--ink-3)";
        const bucketBg    = b => b === "B2B" ? "var(--b2b-soft)" : b.indexOf("B2C") === 0 ? "var(--good-soft)" : b.indexOf("Not") === 0 ? "var(--danger-soft)" : "var(--bg-2)";
        const chips = buckets.map(b => `<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;background:${bucketBg(b)};color:${bucketColor(b)};font-size:10.5px;font-weight:700;margin:2px 4px 2px 0">${escHtml(b)} · ₹${inr(by[b])} · ${list.filter(e => e.bucket === b).length}</span>`).join("");
        const tbl = (title, rows) => rows.length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--ss-navy);font-size:12px">${escHtml(title)} · ₹${inr(rows.reduce((s,e)=>s+e.amount,0))} · ${rows.length} entries</summary>
            <table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px">
              <thead><tr style="color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.07em;background:var(--bg-2)">
                <th style="text-align:left;padding:5px 8px">EMP Code</th><th style="text-align:left;padding:5px 8px">Name</th>
                <th style="text-align:left;padding:5px 8px">Cluster</th><th style="text-align:left;padding:5px 8px">Role</th>
                <th style="text-align:right;padding:5px 8px">Claimed ₹</th></tr></thead>
              <tbody>${rows.map(e => `<tr style="border-top:1px solid var(--line)"><td style="text-align:left;padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:10.5px">${escHtml(e.code)}</td><td style="text-align:left;padding:5px 8px;font-weight:500">${escHtml(e.name) || '<span style="color:var(--ink-4)">(no name)</span>'}</td><td style="text-align:left;padding:5px 8px;color:var(--ink-3)">${escHtml(e.cluster) || "—"}</td><td style="text-align:left;padding:5px 8px;color:var(--ink-3);font-size:11px">${escHtml(e.team || e.designation || e.status || "—")}</td><td style="text-align:right;padding:5px 8px;font-weight:600">₹${inr(e.amount)}</td></tr>`).join("")}</tbody>
            </table></details>` : "";
        return `<div class="card" style="margin-top:14px;padding:14px 16px;border-left:3px solid var(--warn)">
          <h3 style="font-size:12.5px;margin:0 0 4px">Reimbursement for non-B2C codes · ₹${inr(M.reimbursement.notSH)} bifurcation</h3>
          <div style="font-size:11px;color:var(--ink-3);margin-bottom:8px">Claims in the Reimbursement tab whose EMP code is not a B2C service hero. Tap a block to see who.</div>
          <div>${chips}</div>
          ${buckets.map(b => tbl(b, list.filter(e => e.bucket === b))).join("")}
        </div>`;
      })() : ""}
      </div>
    </div>`;
  const dqBtn = document.getElementById("csh-dq-btn"), dqPanel = document.getElementById("csh-dq-panel");
  if (dqBtn && dqPanel) dqBtn.addEventListener("click", () => {
    const open = !dqPanel.classList.contains("open");
    dqPanel.classList.toggle("open", open); dqBtn.classList.toggle("open", open);
    dqBtn.setAttribute("aria-expanded", open ? "true" : "false");
    dqBtn.innerHTML = (open ? '<span class="plus">−</span> Hide data checks' : '<span class="plus">+</span> Data checks');
  });

  // ── tables ──
  const s = csh2.sort;
  rows.sort((a, b) => {
    const va = a[s], vb = b[s];
    if (typeof va === "string" || typeof vb === "string") return csh2.asc ? String(va || "").localeCompare(String(vb || "")) : String(vb || "").localeCompare(String(va || ""));
    const na = va === null || va === undefined, nb = vb === null || vb === undefined;
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    return csh2.asc ? va - vb : vb - va;
  });
  const money = v => (v === null || v === undefined ? "—" : "₹" + inr(v));
  const pvc = v => (v === null || v === undefined ? "—" : "₹" + (+v).toFixed(1));
  const cluCol = isAll ? [{ k: "cluster", l: "Cluster", left: 1 }] : [];
  const COLS = csh2.view === "pervisit" ? [
    { k: "empCode", l: "EMP Code", left: 1 }, { k: "name", l: "SH Name", left: 1 }, ...cluCol,
    { k: "team", l: "Team", left: 1 }, { k: "category", l: "Type", left: 1 }, { k: "visits", l: "Visits", f: v => inr(v || 0) },
    { k: "salCpv", l: "Salary CPV", f: pvc }, { k: "incCpv", l: "Incentive CPV", f: pvc }, { k: "kitCpv", l: "Toolkit CPV", f: pvc },
    { k: "rbCpv", l: "Reimb. CPV", f: pvc }, { k: "nhcCpv", l: "New Hire CPV", f: pvc }, { k: "cpvC", l: "CPV", f: pvc, chip: 1 },
    { k: "bikeV", l: "Bike*", f: pvc }, { k: "vendV", l: "Vendor*", f: pvc }, { k: "schedV", l: "Sched.*", f: pvc },
    { k: "allIn", l: "All-in CPV", f: pvc, bold: 1 },
  ] : [
    { k: "empCode", l: "EMP Code", left: 1 }, { k: "name", l: "SH Name", left: 1 }, ...cluCol,
    { k: "status", l: "Status", left: 1 }, { k: "team", l: "Team", left: 1 }, { k: "category", l: "Type", left: 1 },
    { k: "doj", l: "DOJ", left: 1 }, { k: "sysDays", l: "DIS", f: v => (v === null || v === undefined ? "—" : v) },
    { k: "salary", l: "Salary", f: money }, { k: "incentive", l: "Incentive", f: money }, { k: "toolkit", l: "Toolkit", f: money },
    { k: "reimbursement", l: "Reimb.", f: money }, { k: "totalCost", l: "Total Cost", f: money, bold: 1 },
    { k: "newHireCost", l: "New Hire", f: v => (+v > 0 ? `<span class="chip warn" title="first ${nhcDays()} days from DOJ">₹${inr(v)}</span>` : "—") },
    { k: "pm", l: "PM", f: v => inr(v || 0) }, { k: "cm", l: "CM", f: v => inr(v || 0) }, { k: "visits", l: "Visits", f: v => inr(v || 0), bold: 1 },
    { k: "cpvC", l: "CPV", f: money, chip: 1 },
  ];
  const head = `<thead><tr>${COLS.map(c => `<th data-csh="${c.k}" style="${c.left ? "text-align:left;" : ""}"${s === c.k ? ` class="sorted${csh2.asc ? " asc" : ""}"` : ""}>${c.l}</th>`).join("")}</tr></thead>`;
  const rowHtml = r => {
    const bad = r.flag === "0 visits" || r.flag === "High CPV";
    return `<tr style="${bad ? "background:linear-gradient(90deg,var(--danger-soft) 0%,transparent 55%)" : ""}">${COLS.map(c => {
      let v = r[c.k];
      if (c.k === "empCode") return `<td style="text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2)">${escHtml(v || "—")}</td>`;
      if (c.k === "name") {
        const flag = r.flag === "0 visits" ? ' <span class="chip bad">0 visits</span>' : r.flag === "High CPV" ? ' <span class="chip bad">high CPV</span>' : r.flag === "Low CPV" ? ' <span class="chip good">low CPV</span>' : "";
        return `<td style="text-align:left;font-weight:500">${escHtml(v)}${flag}</td>`;
      }
      if (c.k === "salary" && r.group !== "no_master" && !(+v > 0))
        return `<td><span class="chip bad" title="${escHtml(r.salarySource || "")}">₹0</span></td>`;
      if (c.k === "salary" && +v > 0 && r.salarySource && r.salarySource !== "salary sheet")
        return `<td title="${escHtml(r.salarySource)}">${money(v)}<span style="color:var(--warn);font-size:9px"> ~</span></td>`;
      if (c.k === "reimbursement" && +r.reimbClaimed > 0 && !(+v > 0))
        return `<td title="claimed ₹${inr(r.reimbClaimed)} — set to ₹0 because salary is ₹0" style="color:var(--ink-4)">₹0 <span style="font-size:9px">(₹${inr(r.reimbClaimed)})</span></td>`;
      if (c.left) return `<td style="text-align:left;color:var(--ink-3);font-size:11px">${escHtml(v === null || v === undefined || v === "" ? "—" : v)}</td>`;
      let txt = c.f ? c.f(v) : v;
      if (c.chip && v !== null && v !== undefined && r.flag) txt = `<span class="chip ${r.flag === "Low CPV" ? "good" : "bad"}">${txt}</span>`;
      return `<td style="${c.bold ? "font-weight:700;color:var(--ink)" : ""}">${txt}</td>`;
    }).join("")}</tr>`;
  };
  const groups = [
    { key: "active",    title: "Active SHs",               desc: "Status Active in All SH Mastersheet" },
    { key: "inactive",  title: "Inactive SHs",             desc: "Not active, but did visits or exited this month" },
    { key: "no_master", title: "Not found in mastersheet", desc: "In Visits dump, no mastersheet record (no toolkit; salary only if the code is in the salary sheet)" },
  ];
  const html = groups.map(g => {
    const grp = rows.filter(r => r.group === g.key);
    if (!grp.length) return "";
    const gv = grp.reduce((a, r) => a + (+r.visits || 0), 0), gc = grp.reduce((a, r) => a + (+r.totalCost || 0), 0);
    return `<div style="margin-top:22px">
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap">
        <h3 style="margin:0;font-size:14px;color:var(--ss-navy)">${g.title} <span style="color:var(--ink-3);font-weight:500">· ${grp.length}</span></h3>
        <span style="font-size:11px;color:var(--ink-3)">${g.desc}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${inr(gv)} visits · ₹${inrShort(gc)} · CPV ${gv ? "₹" + inr(gc / gv) : "—"}</span>
      </div>
      <div class="tbl-wrap"><div style="overflow-x:auto"><table class="csh-tbl">${head}<tbody>${grp.map(rowHtml).join("")}</tbody></table></div></div>
    </div>`;
  }).join("");
  document.getElementById("csh-tbl").innerHTML = (html || '<p style="color:var(--ink-3);padding:20px">No SHs match this filter.</p>') +
    `<p style="font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6">
      SH CPV = (salary + incentive + toolkit + reimbursement) ÷ the SH's visits (PM + CM + MAAS). New-hire cost is inside salary.
      ${csh2.view === "pervisit" ? "* Bike, vendor and scheduler are cluster costs (CPV - B2C Actuals) per PM + MAAS visit — the same for every SH in a cluster; All-in CPV = CPV + those three. " : ""}
      ~ = salary matched by name or by the code on the SH's visits. DIS = days since DOJ.
    </p>`;
  document.querySelectorAll("#csh-tbl th[data-csh]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.csh;
    if (csh2.sort === k) csh2.asc = !csh2.asc; else { csh2.sort = k; csh2.asc = ["empCode", "name", "cluster", "status", "team", "category", "doj"].includes(k); }
    redrawClusterSH2();
  }));
}


// ═════════════════════════════════════════════════════════════════════════════
// WATCHLIST — B2C PM SHs who show up but don't do visits
//   Attended days ≥ 20  ·  Total visits < 120  ·  Team B2C · Category PM  ·  DIS > 50
// Thresholds editable at the top of the tab.
// ═════════════════════════════════════════════════════════════════════════════
let watchState = { minDays: 20, maxVisits: 120, minDis: 50, team: "B2C", category: "PM", sort: "vday", asc: true };

function renderWatchlist() {
  const sh  = DATA.shCosts || [];
  const unified = DATA.shDailyUnified || [];
  const daily = DATA.shDailyAll || [];
  const haveLiveFeed = sh.length > 0;

  // attended-days lookup (shDailyAll has .daysActive; fall back to counting non-zero days in shDailyUnified)
  const dayIx = {};
  daily.forEach(r => {
    const k = (r.empCode || "").toString().toLowerCase() + "|" + String(r.name || "").toLowerCase();
    dayIx[k] = { days: +r.daysActive || 0, total: +r.total || 0, pm: +r.pm || 0, cm: +r.cm || 0 };
  });
  unified.forEach(r => {
    const k = (r.empCode || "").toString().toLowerCase() + "|" + String(r.name || "").toLowerCase();
    if (dayIx[k]) return;
    const anyDays = Array((DATA.meta.daysInMonth || 30)).fill(0);
    Object.keys(r.typeDays || {}).forEach(t => (r.typeDays[t] || []).forEach((v, i) => { if (v > 0) anyDays[i] = 1; }));
    const totByType = r.totByType || {};
    dayIx[k] = { days: anyDays.reduce((s, v) => s + v, 0), total: r.total || 0, pm: totByType.PM || 0, cm: totByType.CM || 0 };
  });

  // base rows: use shCosts (team/category/DOJ) and join with attended days
  const base = sh.map(r => {
    const k = (r.empCode || "").toString().toLowerCase() + "|" + String(r.name || "").toLowerCase();
    const d = dayIx[k] || { days: 0, total: +r.visits || 0, pm: +r.pm || 0, cm: +r.cm || 0 };
    return Object.assign({}, r, {
      daysPresent: d.days,
      visitsAll: d.total || +r.visits || 0,
      pmVisits: d.pm || +r.pm || 0,
      cmVisits: d.cm || +r.cm || 0,
      dis: systemDaysFromDoj(r.doj),
      vday: d.days > 0 ? (d.total || +r.visits || 0) / d.days : null,
    });
  });

  // apply filters
  const S = watchState;
  const list = base.filter(r =>
    (!S.team     || r.team === S.team) &&
    (!S.category || r.category === S.category) &&
    (r.dis !== null && r.dis > S.minDis) &&
    r.daysPresent >= S.minDays &&
    r.visitsAll < S.maxVisits
  );

  // sort
  const key = S.sort;
  list.sort((a, b) => {
    const va = a[key], vb = b[key];
    if (typeof va === "string" || typeof vb === "string") return S.asc ? String(va||"").localeCompare(String(vb||"")) : String(vb||"").localeCompare(String(va||""));
    const na = va === null || va === undefined, nb = vb === null || vb === undefined;
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    return S.asc ? va - vb : vb - va;
  });

  const byCluster = {};
  list.forEach(r => { const c = r.cluster || "—"; (byCluster[c] = byCluster[c] || []).push(r); });

  const totalSHs = base.filter(r => (!S.team || r.team === S.team) && (!S.category || r.category === S.category)).length;

  document.getElementById("app").innerHTML = `
    <div class="section" style="margin-top:0">
      <div class="eye">Watchlist · ${escHtml(DATA.meta.month || "")}</div>
      <h2>Low-productivity SHs — present but not completing visits</h2>
      <p class="lead">${S.team || "Any team"} · ${S.category || "any category"} SHs who have been in the system more than ${S.minDis} days, attended ${S.minDays}+ days this month, but did fewer than ${S.maxVisits} visits. ${haveLiveFeed ? "" : "<b>Needs shCosts feed (WebApp v3.0+).</b>"}</p>

      <div class="filter-bar" style="display:flex;gap:14px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px">
        <div><div class="w-lbl">Team</div><select id="w-team"><option value=""${S.team===""?" selected":""}>Any</option>${["B2C","B2B","Assure"].map(t=>`<option value="${t}"${S.team===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div><div class="w-lbl">Category</div><select id="w-cat"><option value=""${S.category===""?" selected":""}>Any</option>${["PM","CM","Assure","CHS","CNI"].map(t=>`<option value="${t}"${S.category===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div><div class="w-lbl">Attended ≥</div><input id="w-days" type="number" min="0" max="31" value="${S.minDays}" style="width:62px"></div>
        <div><div class="w-lbl">Visits &lt;</div><input id="w-vis" type="number" min="0" max="500" value="${S.maxVisits}" style="width:72px"></div>
        <div><div class="w-lbl">In system &gt; (days)</div><input id="w-dis" type="number" min="0" max="2000" value="${S.minDis}" style="width:72px"></div>
        <div style="margin-left:auto;font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${list.length} of ${totalSHs} ${S.team || "all"} ${S.category || ""} SHs match</div>
      </div>

      <div class="grid-4" style="margin-bottom:18px">
        <div class="cost-tile"><div class="lbl">SHs on watchlist</div><div class="val">${list.length}</div><div class="pct">${totalSHs ? Math.round(list.length/totalSHs*100):0}% of ${S.team||"all"} ${S.category||""} SHs</div></div>
        <div class="cost-tile"><div class="lbl">Total visits done</div><div class="val">${inr(list.reduce((s,r)=>s+r.visitsAll,0))}</div><div class="pct">by these SHs this month</div></div>
        <div class="cost-tile"><div class="lbl">Avg visits / day</div><div class="val">${(() => { const a=list.filter(r=>r.vday!=null); return a.length ? (a.reduce((s,r)=>s+r.vday,0)/a.length).toFixed(1) : "—"; })()}</div><div class="pct">visits ÷ attended days</div></div>
        <div class="cost-tile"><div class="lbl">Total cost of these SHs</div><div class="val">₹${inrShort(list.reduce((s,r)=>s+(+r.totalCost||0),0))}</div><div class="pct">salary+incentive+toolkit+reimb</div></div>
      </div>

      <div id="w-table"></div>
    </div>`;

  // bind filters
  const refresh = () => renderWatchlist();
  const bind = (id, k, cast) => { const el = document.getElementById(id); if (el) el.addEventListener("change", e => { watchState[k] = cast(e.target.value); refresh(); }); };
  bind("w-team", "team", v=>v); bind("w-cat", "category", v=>v);
  ["w-days","minDays"].length; // noop
  document.getElementById("w-days").addEventListener("change", e => { watchState.minDays = +e.target.value||0; refresh(); });
  document.getElementById("w-vis").addEventListener("change", e => { watchState.maxVisits = +e.target.value||0; refresh(); });
  document.getElementById("w-dis").addEventListener("change", e => { watchState.minDis = +e.target.value||0; refresh(); });

  if (!list.length) {
    document.getElementById("w-table").innerHTML = '<div style="padding:30px;text-align:center;color:var(--good);font-size:14px;background:var(--good-soft);border-radius:10px"><b>✓ Nothing on the watchlist</b> — no ' + escHtml(S.team||"") + " " + escHtml(S.category||"") + " SHs match these thresholds.</div>";
    return;
  }

  const cols = [
    { k:"empCode",      l:"EMP Code", left:1, f:v=>`<span style="font-family:'JetBrains Mono',monospace;font-size:11px">${escHtml(v||"—")}</span>` },
    { k:"name",         l:"SH Name",  left:1, f:v=>`<b>${escHtml(v)}</b>` },
    { k:"cluster",      l:"Cluster",  left:1, f:v=>escHtml(v) },
    { k:"doj",          l:"DOJ",      left:1, f:v=>`<span style="font-family:'JetBrains Mono',monospace;font-size:11px">${escHtml(v||"—")}</span>` },
    { k:"dis",          l:"DIS",      f:v=>v===null?"—":inr(v) },
    { k:"daysPresent",  l:"Days Present", f:v=>`<span style="font-weight:700;color:var(--ss-navy)">${v}</span>` },
    { k:"visitsAll",    l:"Visits",   f:v=>`<span style="font-weight:700;color:${v<60?"var(--danger)":v<100?"var(--warn)":"var(--ink)"}">${inr(v)}</span>` },
    { k:"pmVisits",     l:"PM",       f:v=>inr(v) },
    { k:"cmVisits",     l:"CM",       f:v=>inr(v) },
    { k:"vday",         l:"V/Day",    f:v=>v===null?"—":`<span style="font-weight:700;color:${v<3?"var(--danger)":v<5?"var(--warn)":"var(--good)"}">${v.toFixed(1)}</span>` },
    { k:"totalCost",    l:"SH Cost",  f:v=>"₹"+inrShort(+v||0) },
    { k:"cpv",          l:"CPV",      f:v=>v?"₹"+inr(v):"—" },
  ];

  const S2 = watchState;
  const head = `<thead><tr>${cols.map(c=>`<th data-k="${c.k}" style="${c.left?"text-align:left;":""}cursor:pointer"${S2.sort===c.k?' class="sorted'+(S2.asc?" asc":"")+'"':""}>${c.l}</th>`).join("")}</tr></thead>`;
  const clusterNames = Object.keys(byCluster).sort((a,b)=>byCluster[b].length-byCluster[a].length);
  const html = clusterNames.map(cl => {
    const rows = byCluster[cl];
    const body = rows.map(r => `<tr>${cols.map(c=>`<td style="${c.left?"text-align:left;":""}">${c.f(r[c.k])}</td>`).join("")}</tr>`).join("");
    const avgV = rows.reduce((s,r)=>s+r.visitsAll,0);
    const avgD = rows.reduce((s,r)=>s+r.daysPresent,0);
    return `<div style="margin-top:14px">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap">
          <h3 style="margin:0;font-size:14px;color:var(--ss-navy)">${escHtml(cl)} <span style="color:var(--ink-3);font-weight:500">· ${rows.length} SH${rows.length===1?"":"s"}</span></h3>
          <span style="margin-left:auto;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${inr(avgV)} visits across ${inr(avgD)} present-days · SOH: ${sohForCluster(cl)}</span>
        </div>
        <div class="tbl-wrap"><div style="overflow-x:auto"><table class="csh-tbl">${head}<tbody>${body}</tbody></table></div></div>
      </div>`;
  }).join("");

  document.getElementById("w-table").innerHTML = html + `<p style="font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6">Days Present = calendar days with ≥ 1 visit of any type (SH Daily All). Visits = all visit types. V/Day = visits ÷ days present. DIS = today − DOJ.</p>`;
  document.querySelectorAll("#w-table th[data-k]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (watchState.sort === k) watchState.asc = !watchState.asc;
    else { watchState.sort = k; watchState.asc = ["empCode","name","cluster","doj"].includes(k); }
    renderWatchlist();
  }));
}


// ═════════════════════════════════════════════════════════════════════════════
// FULL PAY · LOW VISITS — active B2C PM SHs who got (almost) full salary but
// did few visits. "Full salary" = TotalBillable ≥ 95% of monthly CTC (default).
// ═════════════════════════════════════════════════════════════════════════════
let fpState = { team: "B2C", category: "PM", maxVisits: 50, minPaidRatio: 0.9, sort: "paidRatio", asc: false };

function renderFullPay() {
  const sh = DATA.shCosts || [];
  if (!sh.length) {
    document.getElementById("app").innerHTML = `<div class="section" style="margin-top:0"><div class="eye">Full pay · low visits</div><h2>Needs shCosts feed (WebApp v3.0+)</h2></div>`;
    return;
  }
  const S = fpState;
  const base = sh.map(r => {
    const ctc = +r.ctcSalary || 0, sal = +r.salary || 0;
    return Object.assign({}, r, {
      dis: systemDaysFromDoj(r.doj),
      paidRatio: ctc > 0 ? sal / ctc : null,
      paidStatus: ctc > 0 ? (sal >= ctc * S.minPaidRatio ? "Full" : sal >= ctc * 0.5 ? "Partial" : "Minimal") : (sal > 0 ? "No CTC data" : "Unpaid"),
    });
  });
  const list = base.filter(r =>
    r.group === "active" &&
    (!S.team || r.team === S.team) &&
    (!S.category || r.category === S.category) &&
    r.visits < S.maxVisits &&
    r.paidRatio !== null && r.paidRatio >= S.minPaidRatio
  );

  const key = S.sort;
  list.sort((a, b) => {
    const va = a[key], vb = b[key];
    if (typeof va === "string" || typeof vb === "string") return S.asc ? String(va||"").localeCompare(String(vb||"")) : String(vb||"").localeCompare(String(va||""));
    const na = va === null || va === undefined, nb = vb === null || vb === undefined;
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    return S.asc ? va - vb : vb - va;
  });
  const byCluster = {};
  list.forEach(r => { const c = r.cluster || "—"; (byCluster[c] = byCluster[c] || []).push(r); });

  const totalPool = base.filter(r => r.group === "active" && (!S.team || r.team === S.team) && (!S.category || r.category === S.category)).length;
  const totalSalary = list.reduce((s, r) => s + (+r.salary || 0), 0);
  const totalVisits = list.reduce((s, r) => s + (+r.visits || 0), 0);
  const zeroVisit  = list.filter(r => r.visits === 0).length;

  document.getElementById("app").innerHTML = `
    <div class="section" style="margin-top:0">
      <div class="eye">Full pay · low visits · ${escHtml(DATA.meta.month || "")}</div>
      <h2>Getting paid, not delivering</h2>
      <p class="lead">${S.team || "Any team"} · ${S.category || "any category"} · Active SHs whose salary paid is at least ${Math.round(S.minPaidRatio * 100)}% of monthly CTC, but who did fewer than ${S.maxVisits} visits. Ratio = (October Salary payout) ÷ (mastersheet "Salary" col U).</p>

      <div class="filter-bar" style="display:flex;gap:14px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px">
        <div><div class="w-lbl">Team</div><select id="fp-team"><option value=""${S.team===""?" selected":""}>Any</option>${["B2C","B2B","Assure"].map(t=>`<option value="${t}"${S.team===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div><div class="w-lbl">Category</div><select id="fp-cat"><option value=""${S.category===""?" selected":""}>Any</option>${["PM","CM","Assure","CHS","CNI"].map(t=>`<option value="${t}"${S.category===t?" selected":""}>${t}</option>`).join("")}</select></div>
        <div><div class="w-lbl">Visits &lt;</div><input id="fp-vis" type="number" min="0" max="500" value="${S.maxVisits}" style="width:72px"></div>
        <div><div class="w-lbl">Paid ratio ≥ (%)</div><input id="fp-pay" type="number" min="0" max="200" value="${Math.round(S.minPaidRatio*100)}" style="width:72px"></div>
        <div style="margin-left:auto;font-size:12px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${list.length} of ${totalPool} active ${S.team||"all"} ${S.category||""} SHs match</div>
      </div>

      <div class="grid-4" style="margin-bottom:18px">
        <div class="cost-tile"><div class="lbl">SHs on this list</div><div class="val">${list.length}</div><div class="pct">${totalPool ? Math.round(list.length/totalPool*100):0}% of pool · ${zeroVisit} with 0 visits</div></div>
        <div class="cost-tile"><div class="lbl">Salary paid to them</div><div class="val">₹${inrShort(totalSalary)}</div><div class="pct">for ${inr(totalVisits)} visits</div></div>
        <div class="cost-tile"><div class="lbl">Avg paid ratio</div><div class="val">${(() => { const a=list.filter(r=>r.paidRatio!=null); return a.length ? Math.round(a.reduce((s,r)=>s+r.paidRatio,0)/a.length*100) + "%" : "—"; })()}</div><div class="pct">salary ÷ CTC</div></div>
        <div class="cost-tile"><div class="lbl">Avg visits / SH</div><div class="val">${list.length ? (totalVisits/list.length).toFixed(1) : "—"}</div><div class="pct">against ${S.maxVisits} threshold</div></div>
      </div>

      <div id="fp-table"></div>
    </div>`;

  const ref = () => renderFullPay();
  document.getElementById("fp-team").addEventListener("change", e => { fpState.team = e.target.value; ref(); });
  document.getElementById("fp-cat").addEventListener("change", e => { fpState.category = e.target.value; ref(); });
  document.getElementById("fp-vis").addEventListener("change", e => { fpState.maxVisits = +e.target.value||0; ref(); });
  document.getElementById("fp-pay").addEventListener("change", e => { fpState.minPaidRatio = Math.max(0, (+e.target.value||0)/100); ref(); });

  if (!list.length) {
    document.getElementById("fp-table").innerHTML = '<div style="padding:30px;text-align:center;color:var(--good);font-size:14px;background:var(--good-soft);border-radius:10px"><b>✓ Nothing on this list</b> — no active ' + escHtml(S.team||"") + " " + escHtml(S.category||"") + " SHs match these thresholds.</div>";
    return;
  }

  const cols = [
    { k:"empCode",    l:"EMP Code", left:1, f:v=>`<span style="font-family:'JetBrains Mono',monospace;font-size:11px">${escHtml(v||"—")}</span>` },
    { k:"name",       l:"SH Name",  left:1, f:v=>`<b>${escHtml(v)}</b>` },
    { k:"cluster",    l:"Cluster",  left:1, f:v=>escHtml(v) },
    { k:"doj",        l:"DOJ",      left:1, f:v=>`<span style="font-family:'JetBrains Mono',monospace;font-size:11px">${escHtml(v||"—")}</span>` },
    { k:"dis",        l:"DIS",      f:v=>v===null?"—":inr(v) },
    { k:"visits",     l:"Visits",   f:v=>`<span style="font-weight:700;color:${v===0?"var(--danger)":v<20?"var(--danger)":v<40?"var(--warn)":"var(--ink)"}">${inr(v)}</span>` },
    { k:"pm",         l:"PM",       f:v=>inr(v) },
    { k:"cm",         l:"CM",       f:v=>inr(v) },
    { k:"salary",     l:"Salary (₹)",  f:v=>"₹"+inr(v||0) },
    { k:"ctcSalary",  l:"CTC (₹)",     f:v=>(+v)>0?"₹"+inr(v):"—" },
    { k:"paidRatio",  l:"Paid %",   f:v=>v===null?"—":`<span style="font-weight:700;color:${v>=1?"var(--danger)":v>=0.95?"var(--warn)":"var(--ink-2)"}">${Math.round(v*100)}%</span>` },
    { k:"totalCost",  l:"Total Cost",  f:v=>"₹"+inrShort(+v||0) },
    { k:"cpv",        l:"CPV",      f:v=>v?"₹"+inr(v):"—" },
  ];

  const head = `<thead><tr>${cols.map(c=>`<th data-k="${c.k}" style="${c.left?"text-align:left;":""}cursor:pointer"${S.sort===c.k?' class="sorted'+(S.asc?" asc":"")+'"':""}>${c.l}</th>`).join("")}</tr></thead>`;
  const clusters = Object.keys(byCluster).sort((a,b)=>byCluster[b].length-byCluster[a].length);
  document.getElementById("fp-table").innerHTML = clusters.map(cl => {
    const rows = byCluster[cl];
    const body = rows.map(r => `<tr>${cols.map(c=>`<td style="${c.left?"text-align:left;":""}">${c.f(r[c.k])}</td>`).join("")}</tr>`).join("");
    const sumSal = rows.reduce((s,r)=>s+(+r.salary||0),0), sumVis = rows.reduce((s,r)=>s+(+r.visits||0),0);
    return `<div style="margin-top:14px">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap">
          <h3 style="margin:0;font-size:14px;color:var(--ss-navy)">${escHtml(cl)} <span style="color:var(--ink-3);font-weight:500">· ${rows.length} SH${rows.length===1?"":"s"}</span></h3>
          <span style="margin-left:auto;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">₹${inrShort(sumSal)} paid · ${inr(sumVis)} visits · SOH: ${sohForCluster(cl)}</span>
        </div>
        <div class="tbl-wrap"><div style="overflow-x:auto"><table class="csh-tbl">${head}<tbody>${body}</tbody></table></div></div>
      </div>`;
  }).join("") + `<p style="font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6">Paid % = <b>Salary</b> (actually paid from October Salary tab) ÷ <b>CTC</b> (Salary col U in mastersheet, full month). ≥100% = full pay. SHs whose CTC isn't filled in the mastersheet don't show here because the ratio can't be computed.</p>`;
  document.querySelectorAll("#fp-table th[data-k]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (fpState.sort === k) fpState.asc = !fpState.asc;
    else { fpState.sort = k; fpState.asc = ["empCode","name","cluster","doj"].includes(k); }
    renderFullPay();
  }));
}

const RENDER = { overview: renderOverview, quadrant: renderQuadrant, clusters: renderClusters, cpvbreakdown: renderCpvBreakdown, shdaily: renderSHDaily, deepdive: renderDeepDive, cityiq: renderCityIQ, clustersh: renderClusterSH, pmadherence: renderPMAdherence, shoverall: renderSHOverall, watchlist: renderWatchlist, fullpay: renderFullPay };
let currentTab = "overview";

function switchTab(name) {
  currentTab = name;
  if (!DATA) { showLoadError(currentMonthKey); return; }
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  destroyCharts();
  RENDER[name]();
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => switchTab(t.dataset.tab));
});

// ── global SOH filter: any .soh-filter selector re-filters the dataset ──
document.addEventListener("change", e => {
  const el = e.target;
  if (!el || !el.classList || !el.classList.contains("soh-filter")) return;
  activeSoh = el.value;
  applySohView();
  if (!DATA) { showLoadError(currentMonthKey); return; }
  document.querySelectorAll(".soh-filter").forEach(s => { if (s !== el) s.value = activeSoh; });
  destroyCharts();
  RENDER[currentTab]();
});

// ═════════════════════════════════════════════════════════════════════════════
// MONTH SWITCHING
// ═════════════════════════════════════════════════════════════════════════════
async function switchMonth(monthKey) {
  if (monthKey === currentMonthKey) return;
  currentMonthKey = monthKey;
  document.querySelectorAll(".month-tab").forEach(t => t.classList.toggle("active", t.dataset.month === monthKey));
  document.getElementById("app").innerHTML = `<div class="loading"><span class="spin"></span>Loading data…</div>`;
  const ok = await loadData(monthKey);
  if (!ok) { destroyCharts(); showLoadError(monthKey); return; }
  renderHeader();
  destroyCharts();
  RENDER[currentTab]();
}

document.querySelectorAll(".month-tab").forEach(t => {
  t.addEventListener("click", () => switchMonth(t.dataset.month));
});

// ═════════════════════════════════════════════════════════════════════════════
// BOOT

(async () => {
  setChartDefaults();
